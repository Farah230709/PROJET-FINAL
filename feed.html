<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StyleApp — Feed</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/feed.css">
</head>
<body data-page="feed">

  <header class="navbar">
    <div class="navbar__container">
      <a href="home.html" class="navbar__logo">StyleApp</a>

      <nav class="navbar__links">
        <a href="home.html" class="nav-link" data-page="home">Accueil</a>
        <a href="dressing.html" class="nav-link" data-page="dressing">Dressing</a>
        <a href="feed.html" class="nav-link" data-page="feed">Feed</a>
        <a href="generator.html" class="nav-link" data-page="generator">Générateur</a>
        <a href="chatbot.html" class="nav-link" data-page="chatbot">Styliste</a>
        <span class="nav-indicator" id="navIndicator" aria-hidden="true"></span>
      </nav>

      <div class="navbar__actions">
        <div class="theme-switcher">
          <button class="theme-dot" data-theme="light" aria-label="Thème clair"></button>
          <button class="theme-dot" data-theme="dark" aria-label="Thème sombre"></button>
          <button class="theme-dot" data-theme="pink" aria-label="Thème rose"></button>
          <button class="theme-dot" data-theme="lavender" aria-label="Thème lavande"></button>
        </div>

        <a href="login.html" id="loginNavLink" class="btn btn--outline" hidden>Connexion</a>

        <div class="user-menu" id="userMenu" hidden>
          <button class="user-menu__trigger" id="userMenuTrigger" aria-label="Menu utilisateur">
            <img class="user-menu__avatar" src="https://api.dicebear.com/7.x/notionists/svg?seed=user" alt="Mon avatar">
          </button>
          <div class="user-menu__dropdown" id="userDropdown" hidden>
            <a href="login.html" id="logoutBtn">Se déconnecter</a>
          </div>
        </div>
      </div>

      <button class="hamburger" id="hamburgerBtn" aria-label="Ouvrir le menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>

    <nav class="mobile-menu" id="mobileMenu">
      <a href="home.html" class="nav-link" data-page="home">Accueil</a>
      <a href="dressing.html" class="nav-link" data-page="dressing">Dressing</a>
      <a href="feed.html" class="nav-link" data-page="feed">Feed</a>
      <a href="generator.html" class="nav-link" data-page="generator">Générateur</a>
      <a href="chatbot.html" class="nav-link" data-page="chatbot">Styliste</a>
            <a href="login.html" id="mobileLoginLink" class="nav-link" hidden>Connexion</a>
      <a href="login.html" id="mobileLogoutLink" class="nav-link" hidden>Se déconnecter</a>
      <div class="mobile-menu__theme">
        <button class="theme-dot" data-theme="light" aria-label="Thème clair"></button>
        <button class="theme-dot" data-theme="dark" aria-label="Thème sombre"></button>
        <button class="theme-dot" data-theme="pink" aria-label="Thème rose"></button>
        <button class="theme-dot" data-theme="lavender" aria-label="Thème lavande"></button>
      </div>
    </nav>
    <div class="mobile-overlay" id="mobileOverlay" hidden></div>
  </header>

  <main class="feed">

    <section class="feed__header">
      <h1>Feed communautaire</h1>
      <div class="feed__sort">
        <button class="chip is-active" data-sort="trending" type="button">Tendance</button>
        <button class="chip" data-sort="recent" type="button">Récent</button>
      </div>
      <div class="feed__style-filters" id="styleFilters">
        <button class="chip is-active" data-style="all" type="button">Tous</button>
        <button class="chip" data-style="casual" type="button">Casual</button>
        <button class="chip" data-style="streetwear" type="button">Streetwear</button>
        <button class="chip" data-style="chic" type="button">Chic</button>
        <button class="chip" data-style="sport" type="button">Sport</button>
      </div>
    </section>

    <p id="feedLoading" class="empty-state">Chargement des tenues...</p>
    <p id="feedError" class="empty-state" hidden>Impossible de charger le feed pour le moment. Réessaie plus tard.</p>

    <section class="feed__masonry" id="feedGrid"></section>

  </main>

  <div class="modal modal--detail" id="outfitDetailModal" hidden>
    <div class="modal__content">
      <button id="closeDetailModal" class="modal__close" type="button" aria-label="Fermer">&times;</button>
      <div class="detail__image-wrap">
  <img id="detailImage" alt="Tenue en détail">
</div>
      <div class="detail__author">
        <img id="detailAvatar" alt="Avatar de l'auteur">
        <span id="detailAuthorName"></span>
      </div>
      <div class="detail__tags" id="detailPieces"></div>
      <div class="detail__actions">
        <button id="detailLikeBtn" class="btn btn--outline" type="button">J'aime</button>
        <button id="detailSaveBtn" class="btn btn--outline" type="button">Enregistrer</button>
        <a href="generator.html" id="detailInspireBtn" class="btn btn--primary">M'inspirer</a>
      </div>
    </div>
  </div>

  <script src="js/nav.js" defer></script>
  <script src="js/feed.js" defer></script>
</body>
</html>
